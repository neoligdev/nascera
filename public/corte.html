<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Corte Nascera</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; margin: 0; height: 100vh; overflow: hidden; }

    .border-gradient { position: relative; }
    .border-gradient::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      background: linear-gradient(225deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    @keyframes fadeUp { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeUp .4s ease-out both; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
    .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes flowDown { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
    .flow-line { stroke-dasharray: 6 4; animation: flowDown .8s linear infinite; }
    @keyframes nodeGlow { 0%,100%{box-shadow: 0 0 0 0 transparent} 50%{box-shadow: 0 0 20px -4px var(--glow-color)} }
    .node-active { animation: nodeGlow 2s ease-in-out infinite; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 2px; }

    /* Canvas */
    .canvas-container { position: relative; width: 100%; height: calc(100vh - 56px); overflow: auto; }
    .canvas { position: relative; min-width: 100%; min-height: 100%; }

    /* Nodes */
    .node {
      position: absolute; border-radius: 16px; backdrop-filter: blur(16px);
      transition: transform .2s ease, box-shadow .2s ease;
      cursor: pointer; z-index: 10;
    }
    .node:hover { transform: scale(1.02); z-index: 20; }

    /* Connections SVG */
    .connections-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    /* Prose */
    .prose h2 { font-size: 1rem; font-weight: 600; margin: .8rem 0 .4rem; color: #fff; }
    .prose h3 { font-size: .9rem; font-weight: 600; margin: .6rem 0 .3rem; color: #d4d4d4; }
    .prose p { margin: .3rem 0; line-height: 1.55; }
    .prose ul, .prose ol { margin: .3rem 0; padding-left: 1.2rem; }
    .prose li { margin: .15rem 0; line-height: 1.45; font-size: .8rem; }
    .prose table { width: 100%; border-collapse: collapse; margin: .4rem 0; font-size: .8rem; }
    .prose th, .prose td { border: 1px solid rgba(255,255,255,.1); padding: 4px 8px; text-align: left; }
    .prose th { background: rgba(255,255,255,.05); font-weight: 600; }
    .prose strong { color: #fff; }

    /* Input mode tabs */
    .input-tab { transition: all .15s ease; cursor: pointer; }
    .input-tab.active { background: rgba(255,255,255,.1); color: #fff; }
    .input-tab:not(.active) { color: #737373; }
    .input-tab:not(.active):hover { color: #a3a3a3; }

    /* Expanded panel */
    .expand-panel {
      position: fixed; right: 0; top: 56px; bottom: 0; width: 480px; max-width: 90vw;
      background: rgba(10,10,10,.95); backdrop-filter: blur(24px);
      border-left: 1px solid rgba(255,255,255,.08);
      z-index: 40; transform: translateX(100%); transition: transform .3s ease;
      overflow-y: auto;
    }
    .expand-panel.open { transform: translateX(0); }

    @media (max-width: 640px) {
      .expand-panel { width: 100vw; }
    }
  </style>
</head>

<body class="bg-neutral-950 text-white antialiased">

  <!-- Background -->
  <div class="fixed inset-0 -z-10 bg-neutral-950">
    <div class="absolute inset-0 opacity-[0.03]">
      <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="64" id="grid" patternUnits="userSpaceOnUse" width="64"><path d="M64 0H0v64" fill="none" stroke="white" stroke-width=".5"/></pattern></defs><rect fill="url(#grid)" height="100%" width="100%"/></svg>
    </div>
    <div class="pointer-events-none fixed -top-32 -left-32 h-[500px] w-[500px] rounded-full bg-purple-500/[0.05] blur-3xl"></div>
    <div class="pointer-events-none fixed -bottom-32 -right-32 h-[400px] w-[400px] rounded-full bg-amber-400/[0.04] blur-3xl"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-30 border-b border-white/5 bg-neutral-950/80 backdrop-blur-xl">
    <div class="max-w-full mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/home.html" class="text-neutral-500 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div class="flex items-center gap-2">
          <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0012 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 01-2.031.352 5.988 5.988 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L18.75 4.971zm-16.5.52c.99-.203 1.99-.377 3-.52m0 0l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.989 5.989 0 01-2.031.352 5.989 5.989 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L5.25 4.971z"/></svg>
          <h1 class="text-base font-semibold">Corte Nascera</h1>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <!-- Phase indicator in header -->
        <div class="flex items-center gap-1.5" id="headerPhase">
          <div class="w-2 h-2 rounded-full bg-neutral-700" id="hPhase1"></div>
          <div class="w-4 h-px bg-white/10"></div>
          <div class="w-2 h-2 rounded-full bg-neutral-700" id="hPhase2"></div>
          <div class="w-4 h-px bg-white/10"></div>
          <div class="w-2 h-2 rounded-full bg-neutral-700" id="hPhase3"></div>
        </div>
        <button onclick="showHistory()" class="text-xs text-neutral-500 hover:text-white transition-colors flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-white/5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Historico
        </button>
        <button onclick="resetCanvas()" id="btnNewSession" class="text-xs font-medium px-4 py-1.5 rounded-lg bg-white text-black hover:bg-neutral-200 transition-colors">
          Nova Sessao
        </button>
      </div>
    </div>
  </header>

  <!-- Canvas -->
  <div class="canvas-container" id="canvasContainer">
    <div class="canvas" id="canvas">
      <svg class="connections-svg" id="connectionsSvg"></svg>
      <!-- Nodes are rendered by JS -->
    </div>
  </div>

  <!-- Expand Panel (slides from right) -->
  <div class="expand-panel" id="expandPanel">
    <div class="p-5">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2.5" id="panelHeader"></div>
        <button onclick="closePanel()" class="text-neutral-500 hover:text-white transition-colors p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="prose text-sm text-neutral-300" id="panelContent"></div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeHistory()"></div>
    <div class="relative w-full max-w-xl max-h-[70vh] overflow-y-auto bg-neutral-900 border border-white/10 rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold">Historico de Sessoes</h3>
        <button onclick="closeHistory()" class="text-neutral-500 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <div id="historyList" class="space-y-3"></div>
    </div>
  </div>

<script>
// ─── Config ─────────────────────────────────────────────────────────
const ROLES = {
  defesa:         { name: 'Advogado de Defesa', color: 'emerald', icon: 'M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z' },
  acusacao:       { name: 'Promotor', color: 'red', icon: 'M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z' },
  juiz:           { name: 'Juiz', color: 'amber', icon: 'M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0012 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 01-2.031.352 5.988 5.988 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L18.75 4.971zm-16.5.52c.99-.203 1.99-.377 3-.52m0 0l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.989 5.989 0 01-2.031.352 5.989 5.989 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L5.25 4.971z' },
  advogado_diabo: { name: 'Advogado do Diabo', color: 'purple', icon: 'M15.362 5.214A8.252 8.252 0 0112 21 8.25 8.25 0 016.038 7.048 8.287 8.287 0 009 9.6a8.983 8.983 0 013.361-6.867 8.21 8.21 0 003 2.48z' },
  juri:           { name: 'Juri Popular', color: 'blue', icon: 'M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z' },
  perito:         { name: 'Perito Especialista', color: 'cyan', icon: 'M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z' },
};

const COLORS = {
  emerald: { bg: 'rgba(16,185,129,.12)', text: '#34d399', border: 'rgba(16,185,129,.25)', glow: 'rgba(16,185,129,.3)' },
  red:     { bg: 'rgba(239,68,68,.12)',   text: '#f87171', border: 'rgba(239,68,68,.25)',   glow: 'rgba(239,68,68,.3)' },
  amber:   { bg: 'rgba(245,158,11,.12)',  text: '#fbbf24', border: 'rgba(245,158,11,.25)',  glow: 'rgba(245,158,11,.3)' },
  purple:  { bg: 'rgba(168,85,247,.12)',  text: '#c084fc', border: 'rgba(168,85,247,.25)',  glow: 'rgba(168,85,247,.3)' },
  blue:    { bg: 'rgba(59,130,246,.12)',   text: '#60a5fa', border: 'rgba(59,130,246,.25)',  glow: 'rgba(59,130,246,.3)' },
  cyan:    { bg: 'rgba(6,182,212,.12)',    text: '#22d3ee', border: 'rgba(6,182,212,.25)',   glow: 'rgba(6,182,212,.3)' },
};

let token = localStorage.getItem('nascera_token') || localStorage.getItem('fluxora_token');
if (!token) window.location.href = '/';

let currentSessionId = null;
let ws = null;
let selectedRoles = ['defesa', 'acusacao', 'juiz', 'advogado_diabo', 'juri', 'perito'];
let debateRounds = 1;
let inputMode = 'text'; // 'text' | 'url'
let agentContents = {};
let sessionActive = false;
let nodePositions = {};

// ─── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash.slice(1);
  if (hash) {
    loadExistingSession(hash);
  } else {
    renderInputCanvas();
  }
  window.addEventListener('resize', () => {
    if (sessionActive) layoutSessionNodes();
    else renderInputCanvas();
  });
});

// ─── Canvas Rendering ───────────────────────────────────────────────
function clearCanvas() {
  const canvas = document.getElementById('canvas');
  // Remove all nodes
  canvas.querySelectorAll('.node').forEach(n => n.remove());
  document.getElementById('connectionsSvg').innerHTML = '';
}

function renderInputCanvas() {
  sessionActive = false;
  clearCanvas();
  const canvas = document.getElementById('canvas');
  const cw = document.getElementById('canvasContainer').clientWidth;
  const ch = document.getElementById('canvasContainer').clientHeight;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';

  // ─── INPUT NODE (top center) ───
  const inputW = Math.min(520, cw - 48);
  const inputX = (cw - inputW) / 2;
  const inputY = 32;

  const inputNode = document.createElement('div');
  inputNode.className = 'node fade-in';
  inputNode.id = 'node-input';
  inputNode.style.cssText = `left:${inputX}px;top:${inputY}px;width:${inputW}px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);cursor:default;`;
  inputNode.onclick = e => e.stopPropagation();
  inputNode.innerHTML = `
    <div class="p-4">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        </div>
        <span class="text-sm font-semibold text-white">Entrada</span>
        <div class="ml-auto flex gap-1 bg-white/5 rounded-lg p-0.5">
          <div class="input-tab active text-[10px] px-2.5 py-1 rounded-md" data-mode="text" onclick="switchInputMode('text')">Documento</div>
          <div class="input-tab text-[10px] px-2.5 py-1 rounded-md" data-mode="url" onclick="switchInputMode('url')">Link / URL</div>
        </div>
      </div>
      <div id="inputAreaText">
        <textarea id="inputDocument" rows="6" placeholder="Cole aqui o contrato, parecer, defesa, ou qualquer documento..." class="w-full bg-white/5 border border-white/8 rounded-xl px-3 py-2.5 text-xs text-white placeholder-neutral-600 focus:outline-none focus:border-white/15 transition-all resize-y"></textarea>
      </div>
      <div id="inputAreaUrl" class="hidden">
        <input id="inputUrl" type="url" placeholder="https://exemplo.com/documento.pdf" class="w-full bg-white/5 border border-white/8 rounded-xl px-3 py-2.5 text-xs text-white placeholder-neutral-600 focus:outline-none focus:border-white/15 transition-all"/>
        <p class="text-[10px] text-neutral-600 mt-1.5">O conteudo da pagina sera extraido automaticamente</p>
      </div>
      <textarea id="inputContext" rows="2" placeholder="Contexto: ex. Analise se este contrato protege o comprador..." class="w-full bg-white/5 border border-white/8 rounded-xl px-3 py-2.5 text-xs text-white placeholder-neutral-600 focus:outline-none focus:border-white/15 transition-all resize-y mt-2"></textarea>
      <div class="flex items-center justify-between mt-3">
        <div class="flex items-center gap-1.5">
          <span class="text-[10px] text-neutral-600">Rodadas:</span>
          <button onclick="setRounds(1)" class="round-btn text-[10px] px-2 py-0.5 rounded bg-white/10 text-white" data-rounds="1">1</button>
          <button onclick="setRounds(2)" class="round-btn text-[10px] px-2 py-0.5 rounded bg-white/5 text-neutral-500" data-rounds="2">2</button>
        </div>
        <button onclick="startSession()" id="btnStart" class="text-xs font-semibold px-5 py-2 rounded-xl bg-white text-black hover:bg-neutral-200 transition-colors flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/></svg>
          Iniciar Corte
        </button>
      </div>
    </div>`;
  canvas.appendChild(inputNode);

  // ─── ROLE SELECTOR NODES (below input) ───
  const roleKeys = Object.keys(ROLES);
  const nodeW = 150;
  const nodeH = 60;
  const gap = 12;
  const totalW = roleKeys.length * nodeW + (roleKeys.length - 1) * gap;
  const startX = (cw - totalW) / 2;
  const roleY = inputY + 310;

  roleKeys.forEach((id, i) => {
    const r = ROLES[id];
    const c = COLORS[r.color];
    const x = startX + i * (nodeW + gap);
    const isSelected = selectedRoles.includes(id);

    const node = document.createElement('div');
    node.className = 'node fade-in';
    node.id = `node-role-${id}`;
    node.style.cssText = `left:${x}px;top:${roleY}px;width:${nodeW}px;background:${isSelected ? c.bg : 'rgba(255,255,255,.02)'};border:1px solid ${isSelected ? c.border : 'rgba(255,255,255,.06)'};transition:all .2s ease;animation-delay:${i * 0.05}s;`;
    node.onclick = () => toggleRoleNode(id);
    node.innerHTML = `
      <div class="p-3 flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style="background:${c.bg}">
          <svg class="w-3.5 h-3.5" fill="none" stroke="${c.text}" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${r.icon}"/></svg>
        </div>
        <div class="min-w-0">
          <div class="text-[10px] font-semibold truncate" style="color:${isSelected ? c.text : '#525252'}">${r.name}</div>
          <div class="text-[9px] ${isSelected ? 'text-neutral-500' : 'text-neutral-700'}">${isSelected ? 'Ativo' : 'Inativo'}</div>
        </div>
      </div>`;
    canvas.appendChild(node);
  });

  // Draw connections from input to role nodes
  drawInputConnections(inputX, inputY, inputW, startX, roleY, nodeW, nodeH, gap, roleKeys.length);
}

function drawInputConnections(inputX, inputY, inputW, startX, roleY, nodeW, nodeH, gap, count) {
  const svg = document.getElementById('connectionsSvg');
  svg.innerHTML = '';
  const inputCx = inputX + inputW / 2;
  const inputBottom = inputY + 310;

  for (let i = 0; i < count; i++) {
    const id = Object.keys(ROLES)[i];
    const isSelected = selectedRoles.includes(id);
    const nodeCx = startX + i * (nodeW + gap) + nodeW / 2;
    const nodeTop = roleY;

    const midY = inputBottom + (nodeTop - inputBottom) / 2;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${inputCx},${inputBottom} C${inputCx},${midY} ${nodeCx},${midY} ${nodeCx},${nodeTop}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', isSelected ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.04)');
    path.setAttribute('stroke-width', '1.5');
    if (isSelected) path.setAttribute('stroke-dasharray', '4 4');
    svg.appendChild(path);
  }
}

function toggleRoleNode(id) {
  if (sessionActive) return;
  const idx = selectedRoles.indexOf(id);
  if (idx >= 0) {
    if (selectedRoles.length <= 2) return;
    selectedRoles.splice(idx, 1);
  } else {
    selectedRoles.push(id);
  }
  renderInputCanvas();
}

function switchInputMode(mode) {
  inputMode = mode;
  document.querySelectorAll('.input-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  document.getElementById('inputAreaText').classList.toggle('hidden', mode !== 'text');
  document.getElementById('inputAreaUrl').classList.toggle('hidden', mode !== 'url');
}

function setRounds(n) {
  debateRounds = n;
  document.querySelectorAll('.round-btn').forEach(b => {
    const isActive = parseInt(b.dataset.rounds) === n;
    b.className = `round-btn text-[10px] px-2 py-0.5 rounded ${isActive ? 'bg-white/10 text-white' : 'bg-white/5 text-neutral-500'}`;
  });
}

// ─── Start Session ──────────────────────────────────────────────────
async function startSession() {
  let docContent = '';

  if (inputMode === 'url') {
    const url = document.getElementById('inputUrl').value.trim();
    if (!url) return alert('Insira um URL');
    docContent = `[EXTRAIR CONTEUDO DO LINK]: ${url}`;
  } else {
    docContent = document.getElementById('inputDocument').value.trim();
    if (!docContent) return alert('Cole um documento para analise');
  }

  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  btn.innerHTML = '<svg class="w-4 h-4 spinner" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M12 2a10 10 0 019.95 9"/></svg> Iniciando...';

  try {
    const res = await fetch('/api/corte/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        document: docContent,
        context: document.getElementById('inputContext').value.trim(),
        config: { roles: selectedRoles, debateRounds },
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Erro ao criar sessao');
    }

    const data = await res.json();
    currentSessionId = data.sessionId;
    window.location.hash = currentSessionId;

    initSessionCanvas();
    connectWS();
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/></svg> Iniciar Corte';
  }
}

// ─── Session Canvas ─────────────────────────────────────────────────
function initSessionCanvas() {
  sessionActive = true;
  agentContents = {};
  selectedRoles.forEach(r => { agentContents[r] = { phase1: '', debate: [], status: 'pending' }; });
  layoutSessionNodes();
}

function layoutSessionNodes() {
  clearCanvas();
  const canvas = document.getElementById('canvas');
  const cw = document.getElementById('canvasContainer').clientWidth;
  const ch = document.getElementById('canvasContainer').clientHeight;

  const agentCount = selectedRoles.length;
  const nodeW = 220;
  const nodeH = 180;
  const gap = 16;
  const totalW = agentCount * nodeW + (agentCount - 1) * gap;
  const startX = Math.max(24, (cw - totalW) / 2);
  const agentY = 120;

  // Canvas sizing
  const neededW = Math.max(cw, totalW + 48);
  const neededH = Math.max(ch, agentY + nodeH + 300);
  canvas.style.width = neededW + 'px';
  canvas.style.height = neededH + 'px';

  // ─── STATUS NODE (top center) ───
  const statusW = 280;
  const statusX = (neededW - statusW) / 2;
  const statusY = 24;
  nodePositions['status'] = { x: statusX, y: statusY, w: statusW, h: 56 };

  const statusNode = document.createElement('div');
  statusNode.className = 'node fade-in';
  statusNode.id = 'node-status';
  statusNode.style.cssText = `left:${statusX}px;top:${statusY}px;width:${statusW}px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:default;`;
  statusNode.innerHTML = `
    <div class="p-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-amber-500/15 flex items-center justify-center">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div>
          <div class="text-xs font-semibold text-white" id="statusTitle">Fase 1 — Analise Individual</div>
          <div class="text-[10px] text-neutral-500" id="statusSub">Agentes analisando em paralelo...</div>
        </div>
      </div>
      <button onclick="abortSession()" class="text-[10px] text-red-400/60 hover:text-red-400 px-2 py-1 rounded hover:bg-red-500/10 transition-all" id="btnAbort">Abortar</button>
    </div>`;
  canvas.appendChild(statusNode);

  // ─── AGENT NODES ───
  selectedRoles.forEach((id, i) => {
    const r = ROLES[id];
    const c = COLORS[r.color];
    const x = startX + i * (nodeW + gap);
    nodePositions[id] = { x, y: agentY, w: nodeW, h: nodeH };

    const ac = agentContents[id] || { phase1: '', debate: [], status: 'pending' };
    const preview = ac.phase1 ? (ac.phase1.length > 300 ? ac.phase1.substring(0, 300) + '...' : ac.phase1) : '';

    const node = document.createElement('div');
    node.className = 'node fade-in';
    node.id = `node-${id}`;
    node.style.cssText = `left:${x}px;top:${agentY}px;width:${nodeW}px;height:${nodeH}px;background:${c.bg};border:1px solid ${c.border};--glow-color:${c.glow};animation-delay:${i * 0.06}s;overflow:hidden;`;
    node.onclick = () => expandAgent(id);
    node.innerHTML = `
      <div class="p-3 h-full flex flex-col">
        <div class="flex items-center justify-between mb-2 flex-shrink-0">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-lg flex items-center justify-center" style="background:${c.bg}">
              <svg class="w-3.5 h-3.5" fill="none" stroke="${c.text}" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${r.icon}"/></svg>
            </div>
            <span class="text-[11px] font-semibold" style="color:${c.text}">${r.name}</span>
          </div>
          <div id="indicator-${id}"><div class="w-2 h-2 rounded-full bg-neutral-700"></div></div>
        </div>
        <div class="text-[10px] text-neutral-500 mb-1.5" id="status-${id}">Aguardando...</div>
        <div class="flex-1 overflow-hidden text-[10px] text-neutral-400 leading-relaxed" id="content-${id}">
          ${preview ? marked.parse(preview) : '<span class="text-neutral-600 italic">...</span>'}
        </div>
      </div>`;
    canvas.appendChild(node);
  });

  // ─── VERDICT NODE (below agents) ───
  const verdictW = Math.min(500, neededW - 48);
  const verdictX = (neededW - verdictW) / 2;
  const verdictY = agentY + nodeH + 80;
  nodePositions['verdict'] = { x: verdictX, y: verdictY, w: verdictW, h: 60 };

  const verdictNode = document.createElement('div');
  verdictNode.className = 'node fade-in';
  verdictNode.id = 'node-verdict';
  verdictNode.style.cssText = `left:${verdictX}px;top:${verdictY}px;width:${verdictW}px;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);--glow-color:rgba(245,158,11,.3);`;
  verdictNode.onclick = () => expandVerdict();
  verdictNode.innerHTML = `
    <div class="p-4">
      <div class="flex items-center gap-2.5 mb-2">
        <div class="w-8 h-8 rounded-xl bg-amber-500/15 flex items-center justify-center">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0012 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 01-2.031.352 5.988 5.988 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L18.75 4.971zm-16.5.52c.99-.203 1.99-.377 3-.52m0 0l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.989 5.989 0 01-2.031.352 5.989 5.989 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L5.25 4.971z"/></svg>
        </div>
        <div>
          <div class="text-sm font-semibold text-amber-400">Acordao Final</div>
          <div class="text-[10px] text-neutral-500" id="verdictStatus">Aguardando analises...</div>
        </div>
      </div>
      <div class="prose text-[11px] text-neutral-400 max-h-32 overflow-hidden" id="verdictContent"></div>
    </div>`;
  canvas.appendChild(verdictNode);

  // Draw connections
  drawSessionConnections(neededW);
}

function drawSessionConnections(canvasW) {
  const svg = document.getElementById('connectionsSvg');
  svg.innerHTML = '';

  const status = nodePositions['status'];
  const verdict = nodePositions['verdict'];

  selectedRoles.forEach(id => {
    const agent = nodePositions[id];
    if (!agent) return;

    // Status -> Agent
    const sx = status.x + status.w / 2;
    const sy = status.y + status.h;
    const ax = agent.x + agent.w / 2;
    const ay = agent.y;
    const mid1 = sy + (ay - sy) / 2;

    const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p1.setAttribute('d', `M${sx},${sy} C${sx},${mid1} ${ax},${mid1} ${ax},${ay}`);
    p1.setAttribute('fill', 'none');
    p1.setAttribute('stroke', 'rgba(255,255,255,.08)');
    p1.setAttribute('stroke-width', '1');
    p1.id = `conn-status-${id}`;
    svg.appendChild(p1);

    // Agent -> Verdict
    const abottom = agent.y + agent.h;
    const vx = verdict.x + verdict.w / 2;
    const vy = verdict.y;
    const mid2 = abottom + (vy - abottom) / 2;

    const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p2.setAttribute('d', `M${ax},${abottom} C${ax},${mid2} ${vx},${mid2} ${vx},${vy}`);
    p2.setAttribute('fill', 'none');
    p2.setAttribute('stroke', 'rgba(255,255,255,.06)');
    p2.setAttribute('stroke-width', '1');
    p2.id = `conn-${id}-verdict`;
    svg.appendChild(p2);
  });
}

// ─── Update Agent Card (in-place, no re-layout) ────────────────────
function updateAgentNode(role, content, status) {
  const contentEl = document.getElementById(`content-${role}`);
  const statusEl = document.getElementById(`status-${role}`);
  const indEl = document.getElementById(`indicator-${role}`);
  const nodeEl = document.getElementById(`node-${role}`);
  if (!contentEl) return;

  const preview = content.length > 300 ? content.substring(0, 300) + '...' : content;
  contentEl.innerHTML = marked.parse(preview);

  const c = COLORS[ROLES[role].color];

  if (status === 'streaming') {
    statusEl.textContent = 'Analisando...';
    indEl.innerHTML = `<div class="w-2 h-2 rounded-full pulse-dot" style="background:${c.text}"></div>`;
    if (nodeEl) nodeEl.classList.add('node-active');
    // Animate connection
    const conn = document.getElementById(`conn-status-${role}`);
    if (conn) { conn.setAttribute('stroke', c.border); conn.classList.add('flow-line'); }
  } else if (status === 'done') {
    statusEl.textContent = 'Concluido';
    indEl.innerHTML = '<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>';
    if (nodeEl) nodeEl.classList.remove('node-active');
    const conn = document.getElementById(`conn-status-${role}`);
    if (conn) { conn.setAttribute('stroke', 'rgba(16,185,129,.2)'); conn.classList.remove('flow-line'); }
  } else if (status === 'error') {
    statusEl.textContent = 'Erro';
    indEl.innerHTML = '<svg class="w-3.5 h-3.5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>';
    if (nodeEl) nodeEl.classList.remove('node-active');
  }
}

// ─── Load Existing Session ──────────────────────────────────────────
async function loadExistingSession(sessionId) {
  try {
    const res = await fetch(`/api/corte/sessions/${sessionId}`, {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (!res.ok) { renderInputCanvas(); return; }

    const session = await res.json();
    currentSessionId = sessionId;
    selectedRoles = session.config.roles;

    initSessionCanvas();

    // Render existing data
    for (const role of session.config.roles) {
      const a = session.analyses[role];
      if (a && a.content) {
        agentContents[role].phase1 = a.content;
        agentContents[role].status = a.status;
        updateAgentNode(role, a.content, a.status);
      }
    }
    for (const round of session.debate) {
      for (const role of session.config.roles) {
        if (round.responses[role] && round.responses[role].content) {
          agentContents[role].debate[round.round - 1] = round.responses[role].content;
        }
      }
    }
    if (session.verdict && session.verdict.content) {
      document.getElementById('verdictContent').innerHTML = marked.parse(session.verdict.content.substring(0, 400));
      document.getElementById('verdictContent').setAttribute('data-raw', session.verdict.content);
      document.getElementById('verdictStatus').textContent = session.verdict.status === 'done' ? 'Concluido' : 'Gerando...';
    }

    updateHeaderPhase(session.status);

    if (['phase1', 'phase2', 'phase3'].includes(session.status)) {
      connectWS();
    }
    if (session.status === 'completed') {
      document.getElementById('btnAbort').classList.add('hidden');
    }
  } catch {
    renderInputCanvas();
  }
}

function updateHeaderPhase(status) {
  const phaseMap = { phase1: 1, phase2: 2, phase3: 3, completed: 4 };
  const current = phaseMap[status] || 0;
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById(`hPhase${i}`);
    if (i < current || (status === 'completed')) {
      el.className = 'w-2 h-2 rounded-full bg-emerald-400';
    } else if (i === current) {
      el.className = 'w-2 h-2 rounded-full bg-amber-400 pulse-dot';
    } else {
      el.className = 'w-2 h-2 rounded-full bg-neutral-700';
    }
  }

  const titles = {
    phase1: ['Fase 1 — Analise Individual', 'Agentes analisando em paralelo...'],
    phase2: ['Fase 2 — Debate', 'Agentes debatendo entre si...'],
    phase3: ['Fase 3 — Acordao Final', 'Juiz Relator sintetizando...'],
    completed: ['Sessao Concluida', 'Todos os pareceres finalizados'],
  };
  const t = titles[status] || titles.phase1;
  const titleEl = document.getElementById('statusTitle');
  const subEl = document.getElementById('statusSub');
  if (titleEl) titleEl.textContent = t[0];
  if (subEl) subEl.textContent = t[1];
}

// ─── WebSocket ──────────────────────────────────────────────────────
function connectWS() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${token}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'corte:subscribe', sessionId: currentSessionId }));
  };

  ws.onmessage = (evt) => {
    try { handleWSMessage(JSON.parse(evt.data)); } catch {}
  };

  ws.onclose = () => {
    if (currentSessionId && sessionActive) {
      setTimeout(() => { if (currentSessionId && sessionActive) connectWS(); }, 3000);
    }
  };
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'corte:phase':
      const statusMap = { 1: 'phase1', 2: 'phase2', 3: 'phase3' };
      if (msg.status === 'started') updateHeaderPhase(statusMap[msg.phase]);
      if (msg.phase === 2 && msg.status === 'started') {
        selectedRoles.forEach(r => {
          const s = document.getElementById(`status-${r}`);
          if (s) s.textContent = 'Debatendo...';
        });
      }
      if (msg.phase === 3 && msg.status === 'started') {
        document.getElementById('verdictStatus').textContent = 'Gerando acordao...';
        const vNode = document.getElementById('node-verdict');
        if (vNode) vNode.classList.add('node-active');
      }
      break;

    case 'corte:agent:stream': {
      const r = msg.role;
      if (!agentContents[r]) agentContents[r] = { phase1: '', debate: [], status: 'streaming' };
      if (msg.phase === 1) {
        agentContents[r].phase1 += msg.chunk;
        updateAgentNode(r, agentContents[r].phase1, 'streaming');
      } else if (msg.phase === 2) {
        const ri = msg.round || 0;
        if (!agentContents[r].debate[ri]) agentContents[r].debate[ri] = '';
        agentContents[r].debate[ri] += msg.chunk;
        updateAgentNode(r, agentContents[r].debate[ri], 'streaming');
      }
      break;
    }

    case 'corte:agent:done':
      if (agentContents[msg.role]) agentContents[msg.role].status = 'done';
      updateAgentNode(msg.role, msg.content, 'done');
      break;

    case 'corte:agent:error':
      if (msg.role !== 'verdict') {
        updateAgentNode(msg.role, 'Erro: ' + msg.error, 'error');
      }
      break;

    case 'corte:verdict:stream': {
      const vc = document.getElementById('verdictContent');
      const raw = (vc.getAttribute('data-raw') || '') + msg.chunk;
      vc.setAttribute('data-raw', raw);
      vc.innerHTML = marked.parse(raw.length > 400 ? raw.substring(0, 400) + '...' : raw);
      document.getElementById('verdictStatus').textContent = 'Gerando acordao...';
      break;
    }

    case 'corte:verdict:done': {
      const vc = document.getElementById('verdictContent');
      vc.setAttribute('data-raw', msg.content);
      vc.innerHTML = marked.parse(msg.content.substring(0, 400) + (msg.content.length > 400 ? '...' : ''));
      document.getElementById('verdictStatus').textContent = 'Concluido';
      const vNode = document.getElementById('node-verdict');
      if (vNode) vNode.classList.remove('node-active');
      // Light up verdict connections
      selectedRoles.forEach(id => {
        const conn = document.getElementById(`conn-${id}-verdict`);
        if (conn) conn.setAttribute('stroke', 'rgba(245,158,11,.2)');
      });
      break;
    }

    case 'corte:session:complete':
      updateHeaderPhase('completed');
      const btnAbort = document.getElementById('btnAbort');
      if (btnAbort) btnAbort.classList.add('hidden');
      const statusIcon = document.querySelector('#node-status .w-6');
      if (statusIcon) statusIcon.style.background = 'rgba(16,185,129,.15)';
      break;

    case 'corte:session:error':
      alert('Erro: ' + msg.error);
      break;

    case 'corte:state':
      if (msg.session) {
        for (const role of msg.session.config.roles) {
          const a = msg.session.analyses[role];
          if (a && a.content) {
            if (!agentContents[role]) agentContents[role] = { phase1: '', debate: [], status: 'pending' };
            agentContents[role].phase1 = a.content;
            updateAgentNode(role, a.content, a.status);
          }
        }
      }
      break;

    case 'ready':
    case 'pong':
      break;
  }
}

// ─── Expand Panel ───────────────────────────────────────────────────
function expandAgent(role) {
  const r = ROLES[role];
  const c = COLORS[r.color];
  const ac = agentContents[role];
  if (!ac || !ac.phase1) return;

  let full = ac.phase1;
  for (let i = 0; i < ac.debate.length; i++) {
    if (ac.debate[i]) full += '\n\n---\n\n' + ac.debate[i];
  }

  document.getElementById('panelHeader').innerHTML = `
    <div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:${c.bg}">
      <svg class="w-4 h-4" fill="none" stroke="${c.text}" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${r.icon}"/></svg>
    </div>
    <div>
      <div class="text-sm font-semibold" style="color:${c.text}">${r.name}</div>
      <div class="text-[10px] text-neutral-500">Analise completa</div>
    </div>`;
  document.getElementById('panelContent').innerHTML = marked.parse(full);
  document.getElementById('expandPanel').classList.add('open');
}

function expandVerdict() {
  const vc = document.getElementById('verdictContent');
  const raw = vc.getAttribute('data-raw');
  if (!raw) return;

  document.getElementById('panelHeader').innerHTML = `
    <div class="w-8 h-8 rounded-xl bg-amber-500/15 flex items-center justify-center">
      <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0012 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 01-2.031.352 5.988 5.988 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L18.75 4.971zm-16.5.52c.99-.203 1.99-.377 3-.52m0 0l2.62 10.726c.122.499-.106 1.028-.589 1.202a5.989 5.989 0 01-2.031.352 5.989 5.989 0 01-2.031-.352c-.483-.174-.711-.703-.59-1.202L5.25 4.971z"/></svg>
    </div>
    <div>
      <div class="text-sm font-semibold text-amber-400">Acordao Final</div>
      <div class="text-[10px] text-neutral-500">Parecer consolidado</div>
    </div>`;
  document.getElementById('panelContent').innerHTML = marked.parse(raw);
  document.getElementById('expandPanel').classList.add('open');
}

function closePanel() {
  document.getElementById('expandPanel').classList.remove('open');
}

// ─── Abort ──────────────────────────────────────────────────────────
async function abortSession() {
  if (!currentSessionId) return;
  if (!confirm('Abortar sessao?')) return;
  try {
    await fetch(`/api/corte/sessions/${currentSessionId}/abort`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
    });
    const btn = document.getElementById('btnAbort');
    if (btn) btn.classList.add('hidden');
  } catch {}
}

function resetCanvas() {
  currentSessionId = null;
  sessionActive = false;
  if (ws) { ws.close(); ws = null; }
  window.location.hash = '';
  closePanel();
  renderInputCanvas();
}

// ─── History ────────────────────────────────────────────────────────
function showHistory() {
  document.getElementById('historyModal').classList.remove('hidden');
  loadHistoryList();
}
function closeHistory() {
  document.getElementById('historyModal').classList.add('hidden');
}

async function loadHistoryList() {
  const list = document.getElementById('historyList');
  try {
    const res = await fetch('/api/corte/sessions', { headers: { 'Authorization': 'Bearer ' + token } });
    const sessions = await res.json();
    if (!sessions.length) { list.innerHTML = '<p class="text-neutral-500 text-sm">Nenhuma sessao</p>'; return; }

    list.innerHTML = sessions.map(s => {
      const date = new Date(s.createdAt).toLocaleString('pt-BR');
      const sc = { completed: 'text-emerald-400 bg-emerald-500/10', error: 'text-red-400 bg-red-500/10', aborted: 'text-neutral-400 bg-white/5' };
      const sl = { completed: 'Concluido', phase1: 'Fase 1', phase2: 'Fase 2', phase3: 'Fase 3', error: 'Erro', aborted: 'Abortado' };
      return `
        <div class="border-gradient rounded-xl bg-white/5 p-3 cursor-pointer hover:bg-white/[0.07] transition-all" onclick="closeHistory();window.location.hash='${s.id}';loadExistingSession('${s.id}')">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[10px] text-neutral-500">${date}</span>
            <span class="text-[10px] font-medium px-2 py-0.5 rounded-full ${sc[s.status] || 'text-amber-400 bg-amber-500/10'}">${sl[s.status] || s.status}</span>
          </div>
          <p class="text-xs text-neutral-300 line-clamp-2">${s.context || s.documentPreview || 'Sem descricao'}</p>
        </div>`;
    }).join('');
  } catch {
    list.innerHTML = '<p class="text-red-400 text-sm">Erro ao carregar</p>';
  }
}

// ─── Keyboard ───────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
});
</script>
</body>
</html>
