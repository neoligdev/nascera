<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definir senha — Nascera</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:#08060f; color:#e8e6f0; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    width:100%; max-width:400px; background:#12101d; border:1px solid #262336;
    border-radius:16px; padding:36px 32px;
  }
  h1 { font-size:20px; font-weight:600; margin-bottom:6px; }
  p.sub { color:#8b87a0; font-size:14px; margin-bottom:24px; line-height:1.5; }
  label { display:block; font-size:13px; color:#a5a1b8; margin:14px 0 6px; }
  input {
    width:100%; padding:12px 14px; background:#0b0916; color:#e8e6f0;
    border:1px solid #2b2840; border-radius:10px; font-size:15px; outline:none;
  }
  input:focus { border-color:#99FF00; }
  button {
    width:100%; margin-top:22px; padding:13px; border:0; border-radius:10px;
    background:linear-gradient(135deg,#99FF00,#C4F877); color:#08060f;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:16px; font-size:13.5px; line-height:1.5; display:none; padding:11px 13px; border-radius:10px; }
  .msg.erro { display:block; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.35); color:#fca5a5; }
  .msg.ok   { display:block; background:rgba(74,222,128,.08); border:1px solid rgba(74,222,128,.35); color:#86efac; }
</style>
</head>
<body>
  <div class="card">
    <h1>Defina sua senha 🔐</h1>
    <p class="sub">Escolha a senha da sua conta para entrar no Nascera. O link que trouxe você aqui é de uso único.</p>
    <form id="form">
      <label for="s1">Nova senha (mín. 6 caracteres)</label>
      <input type="password" id="s1" required minlength="6" autocomplete="new-password">
      <label for="s2">Confirmar a senha</label>
      <input type="password" id="s2" required minlength="6" autocomplete="new-password">
      <button type="submit" id="btn">Definir senha e entrar</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
<script>
  const token = new URLSearchParams(location.search).get('t');
  const msg = document.getElementById('msg');
  const mostrar = (texto, tipo) => { msg.textContent = texto; msg.className = 'msg ' + tipo; };
  if (!token) mostrar('Link incompleto. Use exatamente o link que você recebeu.', 'erro');

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const s1 = document.getElementById('s1').value, s2 = document.getElementById('s2').value;
    if (s1 !== s2) return mostrar('As senhas não conferem.', 'erro');
    const btn = document.getElementById('btn'); btn.disabled = true;
    try {
      const r = await fetch('/api/primeiro-acesso', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, senha: s1 }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Não foi possível definir a senha.');
      mostrar('Senha definida! Seu usuário é "' + j.username + '". Redirecionando para o login…', 'ok');
      setTimeout(() => { location.href = '/'; }, 2500);
    } catch (err) { mostrar(err.message, 'erro'); btn.disabled = false; }
  });
</script>
</body>
</html>
