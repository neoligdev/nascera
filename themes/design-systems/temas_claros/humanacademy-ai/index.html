    <!-- Meta Pixel + GTM com carregamento adiado.
         Os stubs (fila do fbq e dataLayer) existem desde o primeiro byte,
         então nenhum evento se perde: fbq('track') e dataLayer.push são
         enfileirados e despachados quando os scripts reais chegarem.
         Os scripts externos (fbevents.js, gtm.js e tudo que o GTM puxa:
         TikTok, gtag, Clarity) só carregam no idle ou na primeira
         interação, tirando ~centenas de ms de main thread do caminho
         crítico do mobile sem perder atribuição. -->
    <script>
      !function(f){if(f.fbq)return;var n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];}(window);
      fbq('init', '1581600402785413');
      fbq('track', 'PageView');
      // Mark this path as tracked so the SPA route handler doesn't double-fire.
      window.__metaPixelLastPath = window.location.pathname;

      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});

      (function () {
        var loaded = false;
        function loadTags() {
          if (loaded) return;
          loaded = true;
          [
            'https://connect.facebook.net/en_US/fbevents.js',
            'https://www.googletagmanager.com/gtm.js?id=GTM-K627N58N'
          ].forEach(function (src) {
            var s = document.createElement('script');
            s.async = true;
            s.src = src;
            document.head.appendChild(s);
          });
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadTags, { timeout: 3500 });
        } else {
          setTimeout(loadTags, 3000);
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) {
          window.addEventListener(ev, loadTags, { once: true, passive: true });
        });
      })();
    </script>
